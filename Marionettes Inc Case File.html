* { box-sizing: border-box; }

body { min-height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

.top { position: sticky; top: 0; z-index: 5; background: var(--ink); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brand { font-family: var(--display); font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
.tick { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); animation: tk 1s steps(1) infinite; }
@keyframes tk { 0% { opacity: 1; } 50% { opacity: 0.2; } }
.stats { display: flex; gap: 18px; align-items: center; font-variant-numeric: tabular-nums; color: var(--mute); font-size: 0.95rem; }
.stats b { color: var(--text); }
.slots { display: flex; gap: 6px; }
.slot { width: 34px; height: 38px; border: 1.5px dashed var(--line); border-radius: 4px; display: grid; place-items: center; font-family: var(--display); font-size: 1.4rem; color: var(--amber); }
.slot.on { border-style: solid; border-color: var(--amber); background: #2a2415; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 90px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
main { min-width: 0; }
.hero h1 { font-size: clamp(1.9rem, 4.4vw, 3rem); line-height: 1.1; }
.hero .file { font-family: var(--display); color: var(--amber); font-size: 0.95rem; margin-bottom: 8px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.team { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: end; }
.team label { display: block; font-size: 0.85rem; color: var(--mute); margin-bottom: 4px; }
.team input { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; min-width: 240px; }
.btn { background: var(--amber); color: #1c1a12; border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 700; }
.btn.alt { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 22px; }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
.card:hover:not(:disabled) { border-color: var(--amber); }
.card .n { font-family: var(--display); font-size: 2.4rem; line-height: 1; color: var(--amber); }
.card h3 { font-size: 1.2rem; }
.card small { color: var(--mute); }
.card.done { border-color: var(--good); }
.card.vault { border-style: dashed; }
.stamp { margin-top: auto; font-family: var(--display); color: var(--good); border: 2px solid var(--good); border-radius: 4px; padding: 0 8px; align-self: start; transform: rotate(-3deg); }

.crumb button { background: none; border: 0; color: var(--amber); padding: 0; text-decoration: underline; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 10px 0 18px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); transition: width .3s; }
.q h2 { font-size: 1.35rem; line-height: 1.3; margin-bottom: 6px; }

.shake { animation: sh .35s; }

.checks li.ok::before { content: "✓ "; color: var(--good); }
.think { display: grid; gap: 10px; margin-top: 12px; }
.think div { border-left: 3px solid var(--amber); padding: 4px 12px; }

aside { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; gap: 10px; }
aside h2 { font-size: 1.15rem; }
aside .sub { color: var(--mute); font-size: 0.9rem; }
#q { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 0.85rem; color: var(--mute); }
.res { overflow: auto; display: grid; gap: 8px; padding-right: 2px; }
.hit { background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 0.95rem; }
.hit .l { font-family: var(--display); color: var(--amber); font-size: 0.85rem; }
.hit .fr { color: var(--mute); font-size: 0.85rem; }
mark { background: #5a4713; color: var(--text); padding: 0 2px; border-radius: 2px; }
.fab { display: none; }

@media (max-width: 920px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 72vh; background: var(--panel); border-top: 2px solid var(--amber); padding: 14px 16px; transform: translateY(105%); transition: transform .25s; z-index: 9; }

  .fab { display: block; position: fixed; right: 14px; bottom: 14px; z-index: 8; background: var(--amber); color: #1c1a12; border: 0; border-radius: 99px; padding: 12px 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.5); }

@media (prefers-reduced-motion: reduce) { .tick, .shake { animation: none; } .bar i, aside { transition: none; } }

  var cur = null; // current question runtime state

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function norm(s) { return String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/\s+/g, " ").trim(); }
  function shuffle(a) { var b = a.slice(), i, j, t; for (i = b.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = b[i]; b[i] = b[j]; b[j] = t; } return b; }
  function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

  // ---------- header ----------
  function renderTop() {
    $("score").textContent = state.points;
    $("hints").textContent = state.hints;
    var h = "";
    STATIONS.forEach(function (s) { h += '<span class="slot' + (state.done[s.id] ? " on" : "") + '">' + (state.done[s.id] ? s.letter : "") + "</span>"; });
    $("slots").innerHTML = h;
  }
  function tickClock() {
    if (state.started && !state.finished) state.elapsed = Math.floor((Date.now() - state.started) / 1000);
    $("clock").textContent = fmt(state.elapsed);
  }
  setInterval(tickClock, 1000);

  // ---------- search ----------
  function renderSearch(term) {
    var t = norm(term || "");
    var out = "";
    var list = INDEX;
    if (t) {
      var words = t.split(" ");
      list = INDEX.filter(function (e) {
        var hay = norm(e.l + " " + e.t + " " + e.k + " " + (e.fr || ""));
        return words.every(function (w) { return hay.indexOf(w) > -1; });
      });
    }
    if (!list.length) out = '<div class="hit">No result. Try one word, like <b>bank</b> or <b>tick</b>.</div>';
    list.slice(0, t ? 12 : 8).forEach(function (e) {
      var tx = esc(e.t);
      if (t) t.split(" ").forEach(function (w) { if (w.length > 1) tx = tx.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
      out += '<div class="hit"><div class="l">' + esc(e.l) + "</div>" + tx + (e.fr ? '<div class="fr">' + esc(e.fr) + "</div>" : "") + "</div>";
    });
    $("res").innerHTML = out;
  }
  function initSearch() {
    $("chips").innerHTML = CHIPS.map(function (c) { return '<button type="button" data-chip="' + c + '">' + c + "</button>"; }).join("");
    $("chips").addEventListener("click", function (e) { var b = e.target.closest("[data-chip]"); if (b) { $("q").value = b.getAttribute("data-chip"); renderSearch($("q").value); } });
    $("q").addEventListener("input", function () { renderSearch($("q").value); });
    $("fab").addEventListener("click", function () { var a = $("aside"); a.classList.toggle("open"); $("fab").textContent = a.classList.contains("open") ? "Close the search" : "Search the file"; if (a.classList.contains("open")) $("q").focus(); });
    renderSearch("");
  }

  // ---------- screens ----------
  function home() {
    view.screen = "home";
    var allDone = STATIONS.every(function (s) { return state.done[s.id]; });
    var h = '<section class="hero"><div class="file">FILE 172-259 · SMITH’S LAST NIGHT</div><h1>Prove that Nettie is a marionette.</h1>' +
      "<p>You are an agent of a Congress committee. Marionettes, Inc. is accused of selling people. Visit the four stations, win four code letters and open the vault. Use the search box or your booklet to find the lines fast.</p>";
    if (!state.started) {
      h += '<div class="team"><div><label for="team">Team name</label><input id="team" type="text" maxlength="30" placeholder="e.g. Agents of the Strings" value="' + esc(state.team) + '"></div><button class="btn" id="go" type="button">Start the mission</button></div>';
    } else {
      h += "<p>Team: <b style=\"color:var(--text)\">" + esc(state.team || "Agents") + "</b></p>";
    }
    h += "</section>";
    if (state.started) {
      h += '<div class="cards">';
      STATIONS.forEach(function (s) {
        var d = state.done[s.id];
        h += '<button class="card' + (d ? " done" : "") + '" type="button" data-st="' + s.id + '"><span class="n">' + s.id + "</span><h3>" + esc(s.name) + "</h3><small>" + esc(s.sub) + "</small>" + (d ? '<span class="stamp">LETTER ' + s.letter + "</span>" : "") + "</button>";
      });
      h += '<button class="card vault" type="button" id="vaultBtn"' + (allDone ? "" : " disabled") + '><span class="n">?</span><h3>The Vault</h3><small>' + (allDone ? "Four letters found. Open it." : "Opens with four letters.") + "</small></button></div>";
    }
    $("main").innerHTML = h;
    var go = $("go");
    if (go) go.addEventListener("click", function () { state.team = $("team").value.trim(); state.started = Date.now(); home(); renderTop(); snap(); });
  }

  function openStation(i) {
    view = { screen: "station", s: i, qi: 0 };
    newQ();
  }

  function newQ() {
    var st = STATIONS[view.s], q = st.qs[view.qi];
    cur = { attempts: 0, solved: false, sel: [], seq: [], order: q.type === "order" ? shuffleDiff(q.items) : null, mix: q.type === "match" ? shuffle(q.pairs.map(function (p) { return p[1]; })) : null };
    drawQ();
  }
  function shuffleDiff(items) { var s, n = 0; do { s = shuffle(items); n++; } while (n < 8 && s.join("|") === items.join("|")); return s; }

  function drawQ() {
    var st = STATIONS[view.s], q = st.qs[view.qi], n = st.qs.length;
    var h = '<div class="crumb"><button type="button" id="back">All stations</button><span>Station ' + st.id + " · " + esc(st.name) + "</span></div>";
    h += '<div class="bar"><i style="width:' + Math.round((view.qi / n) * 100) + '%"></i></div>';
    h += '<section class="panel q" id="qbox"><div class="ref">Question ' + (view.qi + 1) + " of " + n + " · " + esc(q.ref) + "</div>";
    if (view.qi === 0) h += '<p style="color:var(--mute);margin:6px 0 0">' + esc(st.intro) + "</p>";
    h += "<h2>" + esc(q.q) + "</h2>";
    var dis = cur.solved ? " disabled" : "";
    if (q.type === "mcq") {
      h += '<div class="opts">' + q.opts.map(function (o, i) { return '<button type="button" class="opt' + (cur.sel[0] === i ? " sel" : "") + '" data-opt="' + i + '"' + dis + '><span class="k">' + "ABCD"[i] + "</span><span>" + esc(o) + "</span></button>"; }).join("") + "</div>";
    } else if (q.type === "multi") {
      h += '<div class="opts">' + q.opts.map(function (o, i) { return '<button type="button" class="opt' + (cur.sel.indexOf(i) > -1 ? " sel" : "") + '" data-opt="' + i + '"' + dis + '><span class="k">' + (cur.sel.indexOf(i) > -1 ? "✓" : "○") + "</span><span>" + esc(o) + "</span></button>"; }).join("") + "</div>";
    } else if (q.type === "lie") {
      h += '<div class="opts">' + q.files.map(function (f) { return '<button type="button" class="opt lie' + (cur.sel[0] === f.id ? " sel" : "") + '" data-opt="' + f.id + '"' + dis + '><span class="k">' + f.id + "</span><span>" + esc(f.t) + "</span></button>"; }).join("") + "</div>";
    } else if (q.type === "text") {
      h += '<div class="opts"><input class="inp" id="ans" type="text" autocomplete="off" placeholder="' + esc(q.ph || "") + '" value="' + esc(cur.text || "") + '"' + dis + "></div>";
    } else if (q.type === "order") {
      h += '<div class="opts">' + cur.order.map(function (o) { var used = cur.seq.indexOf(o) > -1; return '<button type="button" class="opt" data-it="' + esc(o) + '"' + (used || cur.solved ? " disabled" : "") + ">" + esc(o) + "</button>"; }).join("") + "</div>";
      h += '<div class="ref">Your order</div><div class="seq">' + cur.seq.map(function (o, i) { return '<span class="chip">' + (i + 1) + ". " + esc(o) + "</span>"; }).join("") + '</div><div class="row"><button class="btn alt" type="button" id="reset"' + dis + ">Start again</button></div>";
    } else if (q.type === "match") {
      h += '<div class="match">' + q.pairs.map(function (p, i) { return "<div><b>" + esc(p[0]) + '</b><select data-m="' + i + '"' + dis + '><option value="">choose...</option>' + cur.mix.map(function (m) { return '<option value="' + esc(m) + '"' + ((cur.mval && cur.mval[i] === m) ? " selected" : "") + ">" + esc(m) + "</option>"; }).join("") + "</select></div>"; }).join("") + "</div>";
    } else if (q.type === "cloze") {
      h += '<div class="ref">Word bank: ' + q.bank.map(esc).join(" · ") + "</div>";
      var t2 = esc(q.tpl).replace(/\{(\d)\}/g, function (m, k) { return '<select data-c="' + k + '"' + dis + '><option value="">...</option>' + q.bank.map(function (b) { return '<option value="' + b + '"' + ((cur.cval && cur.cval[k] === b) ? " selected" : "") + ">" + b + "</option>"; }).join("") + "</select>"; });
      h += '<p class="cloze">' + t2 + "</p>";
    }
    h += '<div class="row">';
    if (!cur.solved) h += '<button class="btn" type="button" id="check">Check</button><button class="btn alt" type="button" id="hint">Show a hint</button>';
    h += "</div>";
    if (cur.msg) h += '<div class="fb ' + cur.msg.cls + '" role="status">' + cur.msg.html + "</div>";
    if (cur.solved) h += '<div class="row"><button class="btn" type="button" id="next">' + (view.qi + 1 < n ? "Next question" : "Reveal my letter") + "</button></div>";
    h += "</section>";
    $("main").innerHTML = h;
    if (cur.shake) { $("qbox").classList.add("shake"); cur.shake = false; }
  }

  function isRight(q) {
    if (q.type === "mcq") return cur.sel[0] === q.correct;
    if (q.type === "lie") return cur.sel[0] === q.correct;
    if (q.type === "multi") { var a = cur.sel.slice().sort().join(","), b = q.correct.slice().sort().join(","); return a === b; }
    if (q.type === "text") { var v = norm(cur.text || "").replace(/[.]/g, ""); return q.accept.some(function (x) { return norm(x) === v; }); }
    if (q.type === "order") return cur.seq.length === q.items.length && cur.seq.join("|") === q.items.join("|");
    if (q.type === "match") { var mv = cur.mval || []; return q.pairs.every(function (p, i) { return mv[i] === p[1]; }); }
    if (q.type === "cloze") { var cv = cur.cval || []; return q.answers.every(function (x, i) { return cv[i] === x; }); }
    return false;
  }

  function check() {
    var st = STATIONS[view.s], q = st.qs[view.qi];
    var a = $("ans"); if (a) cur.text = a.value;
    if (q.type === "text" && !norm(cur.text || "")) { cur.msg = { cls: "no", html: "Write your answer first." }; drawQ(); return; }
    cur.attempts++;
    if (isRight(q)) {
      cur.solved = true;
      var pts = Math.max(1, 4 - cur.attempts);
      state.points += pts;
      cur.msg = { cls: "ok", html: "<b>Correct, +" + pts + " point" + (pts > 1 ? "s" : "") + ".</b> " + esc(q.why) };
      renderTop(); snap();
    } else {
      cur.shake = true;
      cur.msg = { cls: "no", html: "<b>Not yet.</b> " + (cur.attempts >= 2 ? "Hint: " + esc(q.hint) : "Look at the line again, or use the search box.") };
    }
    drawQ();
  }

  function next() {
    var st = STATIONS[view.s];
    if (view.qi + 1 < st.qs.length) { view.qi++; newQ(); return; }
    state.done[st.id] = true; renderTop(); snap();
    var h = '<div class="crumb"><button type="button" id="back">All stations</button></div><section class="panel"><div class="ref">Station ' + st.id + " complete</div><h2>Code letter found</h2><div class=\"tile\">" + st.letter + "</div><p>" + (st.id === 2 ? "The letter of the file with the lie." : "The first letter of <b>" + st.word + "</b>.") + "</p>";
    var allDone = STATIONS.every(function (s) { return state.done[s.id]; });
    h += '<div class="row">' + (allDone ? '<button class="btn" type="button" id="toVault">Go to the vault</button>' : '<button class="btn" type="button" id="back2">Choose another station</button>') + "</div></section>";
    $("main").innerHTML = h;
  }

  // ---------- vault ----------
  function vault() {
    view.screen = "vault";
    var h = '<div class="crumb"><button type="button" id="back">All stations</button><span>The Vault</span></div><section class="panel"><h2>The Vault</h2>';
    h += '<p style="color:var(--mute)">Read your four letters in order, from station 1 to station 4.</p><div class="tile-row">' + STATIONS.map(function (s) { return '<div class="tile">' + s.letter + "</div>"; }).join("") + "</div>";
    if (!state.vaultOpen) {
      h += '<div class="opts" style="margin-top:14px"><label for="code" style="color:var(--mute)">Which word do the letters spell?</label><input class="inp" id="code" type="text" autocomplete="off" maxlength="12"></div><div class="row"><button class="btn" id="open" type="button">Open the vault</button></div><div id="vmsg"></div>';
    } else {
      h += vaultOpen();
    }
    h += "</section>";
    $("main").innerHTML = h;
    if (state.vaultOpen) wireReport();
  }

  function vaultOpen() {
    var h = '<div style="margin:18px 0"><div class="big">TICK-TICK-TICK</div><p style="font-size:1.25rem;margin:6px 0 0"><b>Nettie is a marionette.</b></p><p style="color:var(--mute);max-width:60ch">It is the sound Smith hears in line 256, with his ear on her chest. It is the same sound as Braling Two’s chest (l. 93).</p></div>';
    h += '<div class="report"><h3 style="font-size:1.2rem;margin:18px 0 6px">Case closed: write your report</h3><p style="color:var(--mute);margin:0 0 8px">Three sentences. Use must, might and a wish.</p>' +
      '<label for="r1">1. Nettie must ...</label><textarea id="r1" rows="2" placeholder="Nettie must be ... because ..."></textarea>' +
      '<label for="r2" style="display:block;margin-top:8px">2. The real Nettie might have ...</label><textarea id="r2" rows="2" placeholder="The real Nettie might have bought ..."></textarea>' +
      '<label for="r3" style="display:block;margin-top:8px">3. I wish / If only Smith ...</label><textarea id="r3" rows="2" placeholder="I wish Smith had ..."></textarea>' +
      '<ul class="checks" id="checks"><li id="c1">Sentence 1 uses must + be or must have</li><li id="c2">Sentence 2 uses might have + past participle</li><li id="c3">Sentence 3 uses I wish or If only</li></ul>' +
      '<div class="row"><button class="btn" type="button" id="verify">Check my report</button><button class="btn alt" type="button" id="copy">Copy my report</button></div><div id="rmsg" style="margin-top:8px;color:var(--mute)"></div></div>';
    h += '<h3 style="font-size:1.2rem;margin:26px 0 4px">Think about it (speak with your team)</h3><div class="think"><div>Who had the same idea as Smith? Why is it ironic?</div><div>Who walks into the apartment in the last sentence (l. 257-259)? Which one is the real Braling?</div><div>Smith thought he was escaping. Who was really controlled?</div></div>';
    h += '<p style="margin-top:20px;color:var(--mute)">Mission time <b style="color:var(--text)">' + fmt(state.elapsed) + '</b> · score <b style="color:var(--text)">' + state.points + "</b> / 60 · hints <b style=\"color:var(--text)\">" + state.hints + "</b>. Show this screen to your teacher.</p>";
    return h;
  }

  function reportChecks() {
    var a = ($("r1") || {}).value || "", b = ($("r2") || {}).value || "", c = ($("r3") || {}).value || "";
    var r = [/\bmust\s+(be|have)\b/i.test(a), /\bmight\s+have\s+\w+/i.test(b), /\b(i\s+wish|if\s+only)\b/i.test(c)];
    [1, 2, 3].forEach(function (i) { $("c" + i).className = r[i - 1] ? "ok" : ""; });
    return r;
  }
  function wireReport() {
    ["r1", "r2", "r3"].forEach(function (id) { $(id).addEventListener("input", reportChecks); });
    $("verify").addEventListener("click", function () {
      var r = reportChecks();
      $("rmsg").textContent = r.every(Boolean) ? "Great report. Your structures are correct." : "Check the structures marked with an empty circle.";
    });
    $("copy").addEventListener("click", function () {
      var txt = "Team: " + (state.team || "Agents") + "\n1. " + $("r1").value + "\n2. " + $("r2").value + "\n3. " + $("r3").value + "\nTime " + fmt(state.elapsed) + ", score " + state.points + "/60, hints " + state.hints;
      try { navigator.clipboard.writeText(txt).then(function () { $("rmsg").textContent = "Copied."; }, function () { $("rmsg").textContent = "Copy is not available here. Select the text and copy it."; }); }
      catch (e) { $("rmsg").textContent = "Copy is not available here. Select the text and copy it."; }
    });
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target;
    var b;
    if ((b = t.closest("[data-st]"))) { openStation(parseInt(b.getAttribute("data-st"), 10) - 1); return; }
    if (t.closest("#back") || t.closest("#back2")) { home(); return; }
    if (t.closest("#vaultBtn") || t.closest("#toVault")) { vault(); return; }
    if (t.closest("#check")) { check(); return; }
    if (t.closest("#next")) { next(); return; }
    if (t.closest("#hint")) { var q = STATIONS[view.s].qs[view.qi]; if (!cur.hinted) { cur.hinted = true; state.hints++; renderTop(); snap(); } cur.msg = { cls: "", html: "<b>Hint:</b> " + esc(q.hint) }; drawQ(); return; }
    if (t.closest("#reset")) { cur.seq = []; drawQ(); return; }
    if (t.closest("#open")) {
      var v = norm($("code").value);
      if (v === "tick") { state.vaultOpen = true; state.finished = true; tickClock(); snap(); vault(); }
      else { $("vmsg").innerHTML = '<div class="fb no">Not the right word. Read the letters from station 1 to 4. If it still fails, one station has a mistake.</div>'; }
      return;
    }
    if ((b = t.closest("[data-opt]")) && view.screen === "station") {
      var qq = STATIONS[view.s].qs[view.qi], val = b.getAttribute("data-opt");
      if (qq.type === "mcq") cur.sel = [parseInt(val, 10)];
      else if (qq.type === "lie") cur.sel = [val];
      else { var ix = parseInt(val, 10), p = cur.sel.indexOf(ix); if (p > -1) cur.sel.splice(p, 1); else cur.sel.push(ix); }
      var a2 = $("ans"); if (a2) cur.text = a2.value;
      drawQ(); return;
    }
    if ((b = t.closest("[data-it]"))) { cur.seq.push(b.getAttribute("data-it")); drawQ(); return; }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute("data-m")) { cur.mval = cur.mval || []; cur.mval[parseInt(t.getAttribute("data-m"), 10)] = t.value; }
    if (t.hasAttribute && t.hasAttribute("data-c")) { cur.cval = cur.cval || []; cur.cval[parseInt(t.getAttribute("data-c"), 10)] = t.value; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "ans") { e.preventDefault(); check(); }
    if (e.key === "Enter" && e.target && e.target.id === "code") { e.preventDefault(); $("open").click(); }
  });

  // ---------- keep place across republish ----------
  function snap() { /* registered below */ }
  function start(data) {
    if (data && data.state) { state = data.state; if (state.started && !state.finished) state.elapsed = Math.floor((Date.now() - state.started) / 1000); }
    renderTop(); initSearch(); tickClock(); home();
  }
  try {
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { state: state }; });
  } catch (e) {}
  var data = null;
  try { data = window.claude && window.claude.hot ? window.claude.hot.data : null; } catch (e) {}
  start(data || {});
})();
</script>
</body>
</html>
